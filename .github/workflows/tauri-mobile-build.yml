name: Build OpenCard Mobile

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  android:
    name: Build Android (APK)
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: opencard-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opencard-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Install NPM dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npm run tauri -- android init
          fi

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: npm run tauri -- android build --apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencard-android
          path: |
            opencard-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            opencard-app/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  ios:
    name: Build iOS (Simulator)
    runs-on: macos-latest

    defaults:
      run:
        working-directory: opencard-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opencard-app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install NPM dependencies
        run: npm ci

      - name: Initialize Tauri iOS project
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            npm run tauri -- ios init
          fi

      - name: Build iOS app for simulator
        run: npm run tauri -- ios build --simulator

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencard-ios-simulator
          path: opencard-app/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: error
