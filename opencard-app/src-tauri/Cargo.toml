[package]
name = "OpenCard"
version = "0.4.0"
description = "A visual card design and template workspace."
authors = ["Yigu Wang"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opencard_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
notify = "6.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
tauri-plugin-store = "2"
tauri-plugin-process = "2"
trash = "5"
fontdb = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
image-atlas = { version = "0.5", features = ["image"] }

[dev-dependencies]
tempfile = "3.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
